services:
  nginx-vod:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount your nginx configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Optional: mount additional config files
      # - ./conf.d:/etc/nginx/conf.d:ro
      # Optional: mount SSL certificates
      # - ./certs:/etc/nginx/certs:ro
      # Mount logs locally for monitoring
      - ./logs:/var/log/nginx
    restart: unless-stopped
    # Optional: set memory limits (recommended higher for remote mode with caching)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    # Note: Videos are fetched from remote object storage (configured in nginx.conf)
