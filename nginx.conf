user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON log format for structured logging
    log_format json_cache_status escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"cache_status":"$upstream_cache_status"'
        '}';
    access_log /var/log/nginx/access.log json_cache_status;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # VOD module cache zones
    vod_metadata_cache metadata_cache 512m;
    vod_response_cache response_cache 128m;

    # Proxy cache zones for direct HLS delivery
    proxy_cache_path /var/cache/nginx/vod_cache levels=1:2 keys_zone=vod_cache_zone:100m max_size=50g inactive=7d use_temp_path=off;

    # HTTP server block (port 80) - redirect to HTTPS
    server {
        listen 80;
        server_name vod.kaukus.no;
        return 301 https://$host$request_uri;
    }

    # HTTPS server block (port 443)
    server {
        listen 443 ssl;
        http2 on;
        server_name vod.kaukus.no;

        # SSL certs
        ssl_certificate     /etc/letsencrypt/live/edge.kaukus.no/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/edge.kaukus.no/privkey.pem;

        vod_last_modified_types *;
        vod_segment_duration 9000;
        vod_align_segments_to_key_frames on;
        vod_dash_fragment_file_name_prefix "segment";
        vod_hls_segment_file_name_prefix "segment";
        vod_manifest_segment_durations_mode accurate;

        location ~ ^/remote/[^/]+/(.*)  {
            internal;
            proxy_pass https://hel1.your-objectstorage.com/$1;
            proxy_http_version 1.1;
            proxy_set_header Host hel1.your-objectstorage.com;
            proxy_set_header Connection "";
            resolver 8.8.8.8;
        }

        # Direct HLS delivery from S3 (pre-existing HLS content)

        # VOD manifest files (.m3u8)
        location ~ ^/vod/.*\.m3u8$ {
            proxy_pass https://hel1.your-objectstorage.com;
            proxy_set_header Host hel1.your-objectstorage.com;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Add bucket and path to the request
            rewrite ^/vod/(.*) /kaukus-video-archive/$1 break;

            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;

            proxy_cache vod_cache_zone;
            proxy_cache_key "$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1m;   # Short cache for manifests
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Hide the upstream CORS header to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;

            # Add our own CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=60" always;
        }

        # VOD video segments (.ts, .mp4, .m4s)
        location ~ ^/vod/.*\.(ts|mp4|m4s|json)$ {
            proxy_pass https://hel1.your-objectstorage.com;
            proxy_set_header Host hel1.your-objectstorage.com;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Add bucket and path to the request
            rewrite ^/vod/(.*) /kaukus-video-archive/$1 break;

            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;

            proxy_cache vod_cache_zone;
            proxy_cache_key "$scheme$host$uri$slice_range";
            proxy_cache_valid 200 24h;  # Long cache for segments
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Enable cache slicing for large files
            slice 1m;
            proxy_set_header Range $slice_range;

            # Hide the upstream CORS header to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;

            # Add our own CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Other VOD files (thumbnails, subtitles, etc.)
        location /vod/ {
            proxy_pass https://hel1.your-objectstorage.com;
            proxy_set_header Host hel1.your-objectstorage.com;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Add bucket and path to the request
            rewrite ^/vod/(.*) /kaukus-video-archive/$1 break;

            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;

            proxy_cache vod_cache_zone;
            proxy_cache_key "$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1h;   # Default cache time
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Hide the upstream CORS header to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;

            # Add our own CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header X-Cache-Status $upstream_cache_status always;

            # Handle OPTIONS requests for CORS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # nginx-vod-module for on-the-fly HLS/DASH creation

        location /hls/ {
            vod hls;
            vod_mode remote;
            vod_upstream_location /remote;

            # CORS headers
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        }

        location /dash/ {
            vod dash;
            vod_mode remote;
            vod_upstream_location /remote;

            # CORS headers
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        }

        location /thumb/ {
            vod thumb;
            vod_mode remote;
            vod_upstream_location /remote;

            # CORS headers
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        }

        # Root location
        location / {
            return 404;
        }
    }
}
